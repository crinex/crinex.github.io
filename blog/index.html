<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Juneyoung Park</title>
  <meta name="description" content="Blog posts by Juneyoung Park — On-Device AI, LLM Optimization, and Research Notes.">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fafaf8;
      --bg-secondary: #f2f1ed;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a5a;
      --text-tertiary: #8a8a9a;
      --accent: #1e3a5f;
      --accent-light: #e8eef5;
      --accent-hover: #142d4a;
      --border: #e0ddd6;
      --border-light: #eae8e2;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
      --radius: 8px;
      --nav-bg: rgba(250,250,248,0.92);
      --tag-bg: #eae8e2;
      --tag-text: #4a4a5a;
      --font: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0f0f14;
      --bg-secondary: #1a1a22;
      --bg-card: #1e1e28;
      --text-primary: #e8e6e0;
      --text-secondary: #a0a0ae;
      --text-tertiary: #6a6a7a;
      --accent: #7ca8d4;
      --accent-light: #1a2a3e;
      --accent-hover: #a0c4e8;
      --border: #2a2a34;
      --border-light: #22222c;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --nav-bg: rgba(15,15,20,0.92);
      --tag-bg: #2a2a34;
      --tag-text: #a0a0ae;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.7;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent-hover); }
    ::selection { background: var(--accent-light); color: var(--accent); }

    /* ========== Navigation ========== */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s;
    }

    .nav-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-weight: 600;
      font-size: 17px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .nav-links a {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .nav-links a:hover {
      color: var(--text-primary);
      background: var(--bg-secondary);
    }

    .nav-links a.active {
      color: var(--accent);
      background: var(--accent-light);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all 0.2s;
      margin-left: 8px;
    }

    .theme-toggle:hover {
      color: var(--text-primary);
      border-color: var(--text-tertiary);
      background: var(--bg-secondary);
    }

    .theme-toggle svg { width: 16px; height: 16px; }

    /* ========== Container ========== */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ========== Blog Header ========== */
    .blog-header {
      padding-top: 100px;
      padding-bottom: 32px;
    }

    .blog-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .blog-desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ========== Filter Tags ========== */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-right: 4px;
    }

    .filter-btn {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 5px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      color: var(--text-primary);
      border-color: var(--border);
    }

    .filter-btn.active {
      color: var(--accent);
      background: var(--accent-light);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* ========== Post List ========== */
    .post-list {
      display: flex;
      flex-direction: column;
    }

    .post-item {
      display: block;
      padding: 24px 0;
      border-bottom: 1px solid var(--border-light);
      transition: all 0.15s;
      color: var(--text-primary);
    }

    .post-item:last-child { border-bottom: none; }

    .post-item:hover .post-title {
      color: var(--accent);
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .post-date {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
    }

    .post-category {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .post-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.4;
      margin-bottom: 6px;
      transition: color 0.15s;
    }

    .post-excerpt {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .post-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .post-tag {
      font-size: 11px;
      color: var(--tag-text);
      background: var(--tag-bg);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .post-read-more {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 10px;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.15s, transform 0.15s;
    }

    .post-read-more svg { width: 12px; height: 12px; }

    .post-item:hover .post-read-more {
      opacity: 1;
      transform: translateX(0);
    }

    /* ========== Empty State ========== */
    .empty-state {
      padding: 80px 0;
      text-align: center;
    }

    .empty-state-icon {
      width: 48px;
      height: 48px;
      color: var(--text-tertiary);
      margin: 0 auto 16px;
    }

    .empty-state-text {
      font-size: 15px;
      color: var(--text-tertiary);
    }

    /* ========== Footer ========== */
    footer {
      padding: 32px 0;
      margin-top: 40px;
      border-top: 1px solid var(--border);
    }

    footer p {
      font-size: 13px;
      color: var(--text-tertiary);
      text-align: center;
    }

    /* ========== Mobile Nav ========== */
    .nav-menu-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      padding: 4px;
    }

    .nav-menu-btn svg { width: 22px; height: 22px; }

    @media (max-width: 768px) {
      .nav-links a.nav-section-link { display: none; }
      .nav-menu-btn { display: flex; }

      .nav-links.open a.nav-section-link { display: block; }

      .nav-links.open {
        position: fixed;
        top: 56px;
        left: 0;
        right: 0;
        background: var(--nav-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        flex-direction: column;
        padding: 8px 24px 16px;
        gap: 0;
      }

      .nav-links.open a.nav-section-link {
        display: block;
        padding: 10px 0;
        font-size: 15px;
      }

      .blog-header { padding-top: 80px; }
      .blog-title { font-size: 26px; }
      .post-title { font-size: 16px; }
      .post-read-more { opacity: 1; transform: translateX(0); }
      .filter-bar { gap: 6px; }
    }

    @media (max-width: 480px) {
      .container { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">Juneyoung Park</a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-section-link">Home</a>
        <a href="/blog/" class="nav-section-link active">Blog</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="display:none"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
          <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
        </button>
        <button class="nav-menu-btn" id="navMenuBtn" aria-label="Toggle menu">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- Blog Header -->
    <div class="blog-header">
      <h1 class="blog-title">Blog</h1>
      <p class="blog-desc">On-Device AI, LLM optimization, research notes, and engineering insights.</p>
    </div>

    <!-- Filter -->
    <div class="filter-bar" id="filterBar">
      <span class="filter-label">Filter</span>
      <button class="filter-btn active" data-filter="all">All</button>
    </div>

    <!-- Post List -->
    <div class="post-list" id="postList"></div>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Juneyoung Park. All rights reserved.</p>
    </footer>

  </div>

  <script>
    // ===== Theme =====
    var html = document.documentElement;
    var sunIcon = document.getElementById('sunIcon');
    var moonIcon = document.getElementById('moonIcon');

    function setTheme(t) {
      html.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
      sunIcon.style.display = t === 'dark' ? 'block' : 'none';
      moonIcon.style.display = t === 'dark' ? 'none' : 'block';
    }

    var saved = localStorage.getItem('theme');
    if (saved) setTheme(saved);
    else if (window.matchMedia('(prefers-color-scheme:dark)').matches) setTheme('dark');

    document.getElementById('themeToggle').addEventListener('click', function() {
      setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // ===== Mobile menu =====
    var menuBtn = document.getElementById('navMenuBtn');
    var navLinks = document.getElementById('navLinks');
    menuBtn.addEventListener('click', function() { navLinks.classList.toggle('open'); });
    navLinks.querySelectorAll('.nav-section-link').forEach(function(l) {
      l.addEventListener('click', function() { navLinks.classList.remove('open'); });
    });

    // ===== Blog Data =====
    var ARROW_SVG = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>';
    var POSTS = [];

    // ===== Render =====
    function renderFilters(posts) {
      var bar = document.getElementById('filterBar');
      // Remove existing filter buttons (keep the "All" button)
      bar.querySelectorAll('.filter-btn:not([data-filter="all"])').forEach(function(b) { b.remove(); });

      var cats = [];
      posts.forEach(function(p) {
        if (cats.indexOf(p.category) === -1) cats.push(p.category);
      });
      cats.forEach(function(c) {
        var btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.setAttribute('data-filter', c);
        btn.textContent = c;
        bar.appendChild(btn);
      });
    }

    function renderPosts(posts) {
      var list = document.getElementById('postList');

      if (!posts.length) {
        list.innerHTML = '<div class="empty-state">' +
          '<svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>' +
          '<p class="empty-state-text">No posts in this category yet.</p></div>';
        return;
      }

      list.innerHTML = posts.map(function(p) {
        var dateStr = new Date(p.date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        return '<a href="/blog/post.html?slug=' + p.slug + '" class="post-item">' +
          '<div class="post-meta">' +
            '<span class="post-date">' + dateStr + '</span>' +
            '<span class="post-category">' + p.category + '</span>' +
          '</div>' +
          '<h2 class="post-title">' + p.title + '</h2>' +
          '<p class="post-excerpt">' + p.excerpt + '</p>' +
          '<div class="post-tags">' + p.tags.map(function(t) { return '<span class="post-tag">' + t + '</span>'; }).join('') + '</div>' +
          '<span class="post-read-more">Read more ' + ARROW_SVG + '</span>' +
        '</a>';
      }).join('');
    }

    // ===== Filter Logic =====
    function setupFilters() {
      document.getElementById('filterBar').addEventListener('click', function(e) {
        if (!e.target.classList.contains('filter-btn')) return;

        document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
        e.target.classList.add('active');

        var filter = e.target.getAttribute('data-filter');
        if (filter === 'all') {
          renderPosts(POSTS);
        } else {
          renderPosts(POSTS.filter(function(p) { return p.category === filter; }));
        }
      });
    }

    // ===== Init: fetch posts from index.json =====
    fetch('/blog/posts/index.json')
      .then(function(res) { return res.json(); })
      .then(function(posts) {
        // Sort by date descending
        posts.sort(function(a, b) { return b.date.localeCompare(a.date); });
        POSTS = posts;
        renderFilters(POSTS);
        renderPosts(POSTS);
        setupFilters();
      })
      .catch(function() {
        document.getElementById('postList').innerHTML =
          '<div class="empty-state"><p class="empty-state-text">Failed to load posts.</p></div>';
      });
  </script>

</body>
</html>
