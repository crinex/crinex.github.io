<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, Pretendard, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="hmxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a6ea5"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="hvxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a9e8f"/>
      <stop offset="100%" stop-color="#1e5f55"/>
    </linearGradient>
    <linearGradient id="scalarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6e19"/>
    </linearGradient>
    <linearGradient id="vtcmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c44e52"/>
      <stop offset="100%" stop-color="#7a2e30"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5b73"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">NPU의 일반적인 내부 구조 (예: Snapdragon 8 Elite · Hexagon)</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#6a7a8e">Matrix Engine · Vector Engine · Scalar Control · On-chip Scratchpad · DMA — 벤더별 이름만 다르다</text>

  <!-- Outer NPU boundary -->
  <rect x="40" y="80" width="680" height="430" rx="14" fill="#ffffff" stroke="#cbd4e2" stroke-width="1.5" filter="url(#soft)"/>
  <text x="60" y="105" font-size="13" font-weight="700" fill="#2f4e77">NPU Accelerator (core)</text>
  <text x="60" y="122" font-size="11" fill="#6a7a8e">Qualcomm은 이 블록을 "Hexagon"이라 부른다 — 하나의 NPU 안에 여러 코어</text>

  <!-- Matrix Engine / HMX block -->
  <g transform="translate(70,160)">
    <rect width="260" height="120" rx="10" fill="url(#hmxGrad)" filter="url(#soft)"/>
    <text x="130" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Matrix Engine</text>
    <text x="130" y="42" text-anchor="middle" font-size="10" fill="#d6e3f0">Qualcomm: HMX · Apple: ANE MXU · Google: MXU</text>
    <!-- MAC array visualization -->
    <g transform="translate(30,52)">
      <g fill="#ffffff" fill-opacity="0.85">
        <rect x="0" y="0" width="14" height="14" rx="2"/>
        <rect x="18" y="0" width="14" height="14" rx="2"/>
        <rect x="36" y="0" width="14" height="14" rx="2"/>
        <rect x="54" y="0" width="14" height="14" rx="2"/>
        <rect x="72" y="0" width="14" height="14" rx="2"/>
        <rect x="90" y="0" width="14" height="14" rx="2"/>
        <rect x="108" y="0" width="14" height="14" rx="2"/>
        <rect x="126" y="0" width="14" height="14" rx="2"/>
        <rect x="144" y="0" width="14" height="14" rx="2"/>
        <rect x="162" y="0" width="14" height="14" rx="2"/>
        <rect x="180" y="0" width="14" height="14" rx="2"/>
        <rect x="198" y="0" width="14" height="14" rx="2"/>
      </g>
      <g fill="#ffffff" fill-opacity="0.65" transform="translate(0,18)">
        <rect x="0" y="0" width="14" height="14" rx="2"/><rect x="18" y="0" width="14" height="14" rx="2"/>
        <rect x="36" y="0" width="14" height="14" rx="2"/><rect x="54" y="0" width="14" height="14" rx="2"/>
        <rect x="72" y="0" width="14" height="14" rx="2"/><rect x="90" y="0" width="14" height="14" rx="2"/>
        <rect x="108" y="0" width="14" height="14" rx="2"/><rect x="126" y="0" width="14" height="14" rx="2"/>
        <rect x="144" y="0" width="14" height="14" rx="2"/><rect x="162" y="0" width="14" height="14" rx="2"/>
        <rect x="180" y="0" width="14" height="14" rx="2"/><rect x="198" y="0" width="14" height="14" rx="2"/>
      </g>
      <g fill="#ffffff" fill-opacity="0.45" transform="translate(0,36)">
        <rect x="0" y="0" width="14" height="14" rx="2"/><rect x="18" y="0" width="14" height="14" rx="2"/>
        <rect x="36" y="0" width="14" height="14" rx="2"/><rect x="54" y="0" width="14" height="14" rx="2"/>
        <rect x="72" y="0" width="14" height="14" rx="2"/><rect x="90" y="0" width="14" height="14" rx="2"/>
        <rect x="108" y="0" width="14" height="14" rx="2"/><rect x="126" y="0" width="14" height="14" rx="2"/>
        <rect x="144" y="0" width="14" height="14" rx="2"/><rect x="162" y="0" width="14" height="14" rx="2"/>
        <rect x="180" y="0" width="14" height="14" rx="2"/><rect x="198" y="0" width="14" height="14" rx="2"/>
      </g>
    </g>
    <text x="130" y="112" text-anchor="middle" font-size="10" fill="#d6e3f0">dense MAC array · INT4/8/16 · FP16 누적</text>
  </g>

  <!-- Vector Engine / HVX block -->
  <g transform="translate(70,310)">
    <rect width="260" height="95" rx="10" fill="url(#hvxGrad)" filter="url(#soft)"/>
    <text x="130" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Vector Engine</text>
    <text x="130" y="40" text-anchor="middle" font-size="10" fill="#c9e5df">Qualcomm: HVX (1024-bit SIMD)</text>
    <text x="130" y="60" text-anchor="middle" font-size="10" fill="#c9e5df">Softmax · LayerNorm · RoPE · GeLU</text>
    <text x="130" y="78" text-anchor="middle" font-size="10" fill="#c9e5df">Dequantization · Residual add</text>
  </g>

  <!-- Scalar Control block -->
  <g transform="translate(70,430)">
    <rect width="260" height="60" rx="10" fill="url(#scalarGrad)" filter="url(#soft)"/>
    <text x="130" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Scalar Control</text>
    <text x="130" y="44" text-anchor="middle" font-size="10" fill="#fff5d6">주소 계산 · loop index · 분기</text>
  </g>

  <!-- On-chip Scratchpad / VTCM -->
  <g transform="translate(360,160)">
    <rect width="340" height="245" rx="10" fill="url(#vtcmGrad)" filter="url(#soft)"/>
    <text x="170" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">On-chip Scratchpad (SW-managed SRAM)</text>
    <text x="170" y="42" text-anchor="middle" font-size="10" fill="#f5d3d4">Qualcomm: VTCM · TPU: Unified Buffer · Apple: local SRAM</text>

    <!-- Tiles -->
    <g transform="translate(18,62)">
      <rect x="0" y="0" width="70" height="38" rx="4" fill="#ffffff" fill-opacity="0.92"/>
      <text x="35" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#7a2e30">W-tile</text>
      <text x="35" y="30" text-anchor="middle" font-size="9" fill="#7a2e30">INT4 weights</text>

      <rect x="78" y="0" width="70" height="38" rx="4" fill="#ffffff" fill-opacity="0.92"/>
      <text x="113" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#7a2e30">A-tile</text>
      <text x="113" y="30" text-anchor="middle" font-size="9" fill="#7a2e30">activations</text>

      <rect x="156" y="0" width="70" height="38" rx="4" fill="#ffffff" fill-opacity="0.92"/>
      <text x="191" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#7a2e30">KV-tile</text>
      <text x="191" y="30" text-anchor="middle" font-size="9" fill="#7a2e30">INT8 cache</text>

      <rect x="234" y="0" width="70" height="38" rx="4" fill="#ffffff" fill-opacity="0.92"/>
      <text x="269" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#7a2e30">Scales</text>
      <text x="269" y="30" text-anchor="middle" font-size="9" fill="#7a2e30">per-group</text>

      <rect x="0" y="48" width="148" height="38" rx="4" fill="#ffffff" fill-opacity="0.85"/>
      <text x="74" y="65" text-anchor="middle" font-size="10" font-weight="700" fill="#7a2e30">Output accumulator</text>
      <text x="74" y="78" text-anchor="middle" font-size="9" fill="#7a2e30">FP16 / INT32 partial sums</text>

      <rect x="156" y="48" width="148" height="38" rx="4" fill="#ffffff" fill-opacity="0.85"/>
      <text x="230" y="65" text-anchor="middle" font-size="10" font-weight="700" fill="#7a2e30">Double buffer</text>
      <text x="230" y="78" text-anchor="middle" font-size="9" fill="#7a2e30">compute ↔ DMA overlap</text>

      <rect x="0" y="96" width="304" height="38" rx="4" fill="#ffffff" fill-opacity="0.75"/>
      <text x="152" y="113" text-anchor="middle" font-size="10" font-weight="700" fill="#7a2e30">Attention working set (Q, K, V, scores)</text>
      <text x="152" y="126" text-anchor="middle" font-size="9" fill="#7a2e30">row / column tiled — 현재 블록만 on-chip</text>
    </g>
    <text x="170" y="225" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Hexagon 기준 ~8 MB · 대역폭은 DDR의 100배 이상</text>
  </g>

  <!-- DMA block -->
  <g transform="translate(360,430)">
    <rect width="340" height="60" rx="10" fill="#2f3d57" filter="url(#soft)"/>
    <text x="170" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">DMA Engine</text>
    <text x="170" y="44" text-anchor="middle" font-size="10" fill="#d7dae3">async DRAM ↔ scratchpad · 연산과 병렬</text>
  </g>

  <!-- Right: DRAM / Memory -->
  <g transform="translate(740,160)">
    <rect width="140" height="350" rx="10" fill="#ffffff" stroke="#cbd4e2" stroke-width="1.5" filter="url(#soft)"/>
    <text x="70" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#2f4e77">DRAM</text>
    <text x="70" y="42" text-anchor="middle" font-size="10" fill="#6a7a8e">LPDDR5X</text>
    <g transform="translate(16,56)">
      <rect width="108" height="70" rx="6" fill="#eef2f7" stroke="#cbd4e2"/>
      <text x="54" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#2f4e77">Model weights</text>
      <text x="54" y="38" text-anchor="middle" font-size="9" fill="#6a7a8e">INT4, ~수 GB</text>
      <text x="54" y="54" text-anchor="middle" font-size="9" fill="#6a7a8e">static, read-only</text>
    </g>
    <g transform="translate(16,136)">
      <rect width="108" height="70" rx="6" fill="#eef2f7" stroke="#cbd4e2"/>
      <text x="54" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#2f4e77">KV Cache</text>
      <text x="54" y="38" text-anchor="middle" font-size="9" fill="#6a7a8e">INT8, 수백 MB</text>
      <text x="54" y="54" text-anchor="middle" font-size="9" fill="#6a7a8e">growing / streaming</text>
    </g>
    <g transform="translate(16,216)">
      <rect width="108" height="60" rx="6" fill="#eef2f7" stroke="#cbd4e2"/>
      <text x="54" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#2f4e77">Activations</text>
      <text x="54" y="38" text-anchor="middle" font-size="9" fill="#6a7a8e">FP16 / INT8</text>
      <text x="54" y="52" text-anchor="middle" font-size="9" fill="#6a7a8e">layer-scoped</text>
    </g>
    <text x="70" y="300" text-anchor="middle" font-size="10" fill="#6a7a8e">~70 GB/s</text>
    <text x="70" y="316" text-anchor="middle" font-size="10" fill="#6a7a8e">(대역폭 병목)</text>
  </g>

  <!-- Data flow arrows -->
  <g stroke="#4a5b73" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M745 462 L 705 460"/>
    <path d="M530 430 L 530 410"/>
    <path d="M360 240 L 335 240"/>
    <path d="M360 345 L 335 345"/>
    <path d="M335 210 L 360 210" stroke-dasharray="4,3"/>
    <path d="M335 375 L 360 375" stroke-dasharray="4,3"/>
  </g>

  <!-- Legend -->
  <g transform="translate(60,525)">
    <rect x="0" y="0" width="14" height="10" rx="2" fill="#3a6ea5"/>
    <text x="20" y="9" font-size="10" fill="#4a5b73">Matrix engine</text>
    <rect x="120" y="0" width="14" height="10" rx="2" fill="#3a9e8f"/>
    <text x="140" y="9" font-size="10" fill="#4a5b73">Vector engine</text>
    <rect x="230" y="0" width="14" height="10" rx="2" fill="#c9a227"/>
    <text x="250" y="9" font-size="10" fill="#4a5b73">Scalar</text>
    <rect x="300" y="0" width="14" height="10" rx="2" fill="#c44e52"/>
    <text x="320" y="9" font-size="10" fill="#4a5b73">On-chip SRAM</text>
    <line x1="445" y1="5" x2="465" y2="5" stroke="#4a5b73" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="470" y="9" font-size="10" fill="#4a5b73">read</text>
    <line x1="510" y1="5" x2="530" y2="5" stroke="#4a5b73" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="535" y="9" font-size="10" fill="#4a5b73">write-back</text>
  </g>
</svg>
