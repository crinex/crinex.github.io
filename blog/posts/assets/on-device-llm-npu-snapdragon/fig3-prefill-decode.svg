<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Inter, Pretendard, sans-serif">
  <defs>
    <linearGradient id="pdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="pdSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="pdArr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4e77"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="url(#pdBg)"/>

  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">LLM 추론의 두 얼굴: Prefill vs Decode</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#6a7a8e">같은 가중치, 완전히 다른 연산 패턴 → NPU 활용률도 정반대</text>

  <!-- Prefill -->
  <g transform="translate(40,90)">
    <rect width="420" height="380" rx="14" fill="#ffffff" stroke="#cbd4e2" filter="url(#pdSoft)"/>
    <text x="210" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a5f">Prefill (프롬프트 처리)</text>
    <text x="210" y="52" text-anchor="middle" font-size="11" fill="#6a7a8e">입력 토큰 N개를 한 번에 forward</text>

    <!-- Input tokens block -->
    <g transform="translate(30,80)">
      <text x="0" y="-4" font-size="11" fill="#2f4e77">입력: N개 토큰 (예: 512)</text>
      <g fill="#3a6ea5">
        <rect x="0" y="0" width="12" height="22" rx="2"/><rect x="14" y="0" width="12" height="22" rx="2"/>
        <rect x="28" y="0" width="12" height="22" rx="2"/><rect x="42" y="0" width="12" height="22" rx="2"/>
        <rect x="56" y="0" width="12" height="22" rx="2"/><rect x="70" y="0" width="12" height="22" rx="2"/>
        <rect x="84" y="0" width="12" height="22" rx="2"/><rect x="98" y="0" width="12" height="22" rx="2"/>
        <rect x="112" y="0" width="12" height="22" rx="2"/><rect x="126" y="0" width="12" height="22" rx="2"/>
        <rect x="140" y="0" width="12" height="22" rx="2"/><rect x="154" y="0" width="12" height="22" rx="2"/>
        <rect x="168" y="0" width="12" height="22" rx="2"/><rect x="182" y="0" width="12" height="22" rx="2"/>
        <rect x="196" y="0" width="12" height="22" rx="2"/><rect x="210" y="0" width="12" height="22" rx="2"/>
        <rect x="224" y="0" width="12" height="22" rx="2"/><rect x="238" y="0" width="12" height="22" rx="2"/>
        <rect x="252" y="0" width="12" height="22" rx="2"/><rect x="266" y="0" width="12" height="22" rx="2"/>
        <rect x="280" y="0" width="12" height="22" rx="2"/><rect x="294" y="0" width="12" height="22" rx="2"/>
        <rect x="308" y="0" width="12" height="22" rx="2"/><rect x="322" y="0" width="12" height="22" rx="2"/>
      </g>
      <text x="170" y="42" text-anchor="middle" font-size="10" fill="#8a98ad">... 총 N</text>
    </g>

    <!-- HMX utilization bar -->
    <g transform="translate(30,145)">
      <text x="0" y="-4" font-size="11" fill="#2f4e77">HMX (MatMul 유닛) 활용률</text>
      <rect x="0" y="0" width="360" height="22" rx="4" fill="#eef2f7" stroke="#cbd4e2"/>
      <rect x="0" y="0" width="340" height="22" rx="4" fill="#3a6ea5"/>
      <text x="180" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">~94% compute bound</text>
    </g>

    <!-- Bandwidth bar -->
    <g transform="translate(30,185)">
      <text x="0" y="-4" font-size="11" fill="#2f4e77">메모리 대역폭 사용</text>
      <rect x="0" y="0" width="360" height="22" rx="4" fill="#eef2f7" stroke="#cbd4e2"/>
      <rect x="0" y="0" width="130" height="22" rx="4" fill="#c9a227"/>
      <text x="180" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#4a3a0a">weights 한 번 읽고 재사용</text>
    </g>

    <!-- Arithmetic intensity -->
    <g transform="translate(30,230)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#2f4e77">Arithmetic Intensity (FLOP / byte)</text>
      <text x="0" y="22" font-size="11" fill="#6a7a8e">높음 · 한 weight로 N개 token을 처리</text>
      <text x="0" y="40" font-size="11" fill="#6a7a8e">→ HMX가 쉬지 않음 (compute-bound)</text>
    </g>

    <!-- MatMul shapes -->
    <g transform="translate(30,295)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#2f4e77">MatMul 모양: [N × D] × [D × D]</text>
      <rect x="0" y="10" width="60" height="40" fill="#3a6ea5" fill-opacity="0.85"/>
      <text x="30" y="34" text-anchor="middle" font-size="10" fill="#ffffff">N×D</text>
      <text x="70" y="36" font-size="14" fill="#4a5b73">×</text>
      <rect x="86" y="10" width="60" height="40" fill="#3a6ea5" fill-opacity="0.6"/>
      <text x="116" y="34" text-anchor="middle" font-size="10" fill="#ffffff">D×D</text>
      <text x="156" y="36" font-size="14" fill="#4a5b73">=</text>
      <rect x="172" y="10" width="60" height="40" fill="#3a6ea5"/>
      <text x="202" y="34" text-anchor="middle" font-size="10" fill="#ffffff">N×D</text>
      <text x="250" y="36" font-size="10" fill="#6a7a8e">큰 행렬 → 효율적</text>
    </g>

    <text x="210" y="365" text-anchor="middle" font-size="11" font-style="italic" fill="#3a6ea5">Time-To-First-Token (TTFT)을 결정</text>
  </g>

  <!-- Decode -->
  <g transform="translate(500,90)">
    <rect width="420" height="380" rx="14" fill="#ffffff" stroke="#cbd4e2" filter="url(#pdSoft)"/>
    <text x="210" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#7a2e30">Decode (토큰 생성)</text>
    <text x="210" y="52" text-anchor="middle" font-size="11" fill="#6a7a8e">한 번에 토큰 1개씩 — autoregressive</text>

    <!-- Input single token -->
    <g transform="translate(30,80)">
      <text x="0" y="-4" font-size="11" fill="#7a2e30">입력: 단 1개 토큰</text>
      <rect x="0" y="0" width="18" height="22" rx="2" fill="#c44e52"/>
      <text x="30" y="15" font-size="10" fill="#6a7a8e">(반복 호출)</text>
    </g>

    <!-- HMX util -->
    <g transform="translate(30,145)">
      <text x="0" y="-4" font-size="11" fill="#7a2e30">HMX 활용률</text>
      <rect x="0" y="0" width="360" height="22" rx="4" fill="#eef2f7" stroke="#cbd4e2"/>
      <rect x="0" y="0" width="50" height="22" rx="4" fill="#c44e52"/>
      <text x="180" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#7a2e30">~12% (한산함)</text>
    </g>

    <!-- Bandwidth -->
    <g transform="translate(30,185)">
      <text x="0" y="-4" font-size="11" fill="#7a2e30">메모리 대역폭 사용</text>
      <rect x="0" y="0" width="360" height="22" rx="4" fill="#eef2f7" stroke="#cbd4e2"/>
      <rect x="0" y="0" width="350" height="22" rx="4" fill="#c44e52"/>
      <text x="180" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">~97% memory-bound</text>
    </g>

    <!-- Arithmetic intensity -->
    <g transform="translate(30,230)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#7a2e30">Arithmetic Intensity (FLOP / byte)</text>
      <text x="0" y="22" font-size="11" fill="#6a7a8e">매우 낮음 · 한 토큰당 전체 weight 읽음</text>
      <text x="0" y="40" font-size="11" fill="#6a7a8e">→ DDR 대역폭이 모든 걸 결정</text>
    </g>

    <!-- MatMul shapes -->
    <g transform="translate(30,295)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#7a2e30">MatMul 모양: [1 × D] × [D × D]</text>
      <rect x="0" y="28" width="60" height="12" fill="#c44e52" fill-opacity="0.85"/>
      <text x="30" y="38" text-anchor="middle" font-size="9" fill="#ffffff">1×D</text>
      <text x="70" y="36" font-size="14" fill="#4a5b73">×</text>
      <rect x="86" y="10" width="60" height="40" fill="#c44e52" fill-opacity="0.6"/>
      <text x="116" y="34" text-anchor="middle" font-size="10" fill="#ffffff">D×D</text>
      <text x="156" y="36" font-size="14" fill="#4a5b73">=</text>
      <rect x="172" y="28" width="60" height="12" fill="#c44e52"/>
      <text x="202" y="38" text-anchor="middle" font-size="9" fill="#ffffff">1×D</text>
      <text x="250" y="36" font-size="10" fill="#6a7a8e">GEMV → 비효율</text>
    </g>

    <text x="210" y="365" text-anchor="middle" font-size="11" font-style="italic" fill="#c44e52">초당 Tokens/sec (decode speed)을 결정</text>
  </g>
</svg>
