<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, Pretendard, sans-serif">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="fArr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4e77"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="url(#fBg)"/>

  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Operator Fusion: VTCM을 떠나지 않는 연산들</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#6a7a8e">fusion 전에는 매 op마다 DDR round-trip · fusion 후 VTCM 안에서 완결</text>

  <!-- Before fusion -->
  <g transform="translate(40,85)">
    <rect width="420" height="310" rx="12" fill="#ffffff" stroke="#cbd4e2" filter="url(#fSoft)"/>
    <text x="210" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#7a2e30">Before (naive)</text>
    <text x="210" y="46" text-anchor="middle" font-size="10" fill="#6a7a8e">각 op마다 DDR 왕복</text>

    <g transform="translate(30,66)">
      <!-- op nodes -->
      <rect x="0" y="0" width="360" height="30" rx="5" fill="#c44e52"/>
      <text x="180" y="19" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">MatMul (Q)</text>

      <g transform="translate(0,40)">
        <rect x="0" y="0" width="360" height="14" rx="3" fill="#e0b4b5"/>
        <text x="180" y="11" text-anchor="middle" font-size="9" fill="#7a2e30">store → DDR · load ← DDR</text>
      </g>

      <rect x="0" y="64" width="360" height="30" rx="5" fill="#3a9e8f"/>
      <text x="180" y="83" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">RoPE (rotate)</text>

      <g transform="translate(0,104)">
        <rect x="0" y="0" width="360" height="14" rx="3" fill="#b9d8d3"/>
        <text x="180" y="11" text-anchor="middle" font-size="9" fill="#2f4e57">store → DDR · load ← DDR</text>
      </g>

      <rect x="0" y="128" width="360" height="30" rx="5" fill="#c44e52"/>
      <text x="180" y="147" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">QK<tspan font-size="8" dy="-3">⊤</tspan><tspan dy="3"></tspan> MatMul</text>

      <g transform="translate(0,168)">
        <rect x="0" y="0" width="360" height="14" rx="3" fill="#e0b4b5"/>
        <text x="180" y="11" text-anchor="middle" font-size="9" fill="#7a2e30">store → DDR · load ← DDR</text>
      </g>

      <rect x="0" y="192" width="360" height="30" rx="5" fill="#3a9e8f"/>
      <text x="180" y="211" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">Softmax (HVX)</text>
    </g>

    <text x="210" y="290" text-anchor="middle" font-size="11" fill="#7a2e30" font-weight="600">총 DDR traffic: 4× tensor size · latency ↑</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(478,235)">
    <path d="M0,0 L 34,0" stroke="#2f4e77" stroke-width="2.5" marker-end="url(#fArr)" fill="none"/>
    <text x="18" y="-8" text-anchor="middle" font-size="11" font-weight="700" fill="#2f4e77">fuse</text>
  </g>

  <!-- After fusion -->
  <g transform="translate(520,85)">
    <rect width="420" height="310" rx="12" fill="#ffffff" stroke="#cbd4e2" filter="url(#fSoft)"/>
    <text x="210" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e5f55">After (fused kernel)</text>
    <text x="210" y="46" text-anchor="middle" font-size="10" fill="#6a7a8e">VTCM 안에서 pipeline</text>

    <g transform="translate(30,66)">
      <rect x="0" y="0" width="360" height="180" rx="8" fill="#eef8f6" stroke="#3a9e8f" stroke-width="1.5"/>
      <text x="180" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e5f55">Fused "FlashAttention-style" kernel</text>

      <g transform="translate(16,36)">
        <rect x="0" y="0" width="150" height="32" rx="5" fill="#3a6ea5"/>
        <text x="75" y="20" text-anchor="middle" font-size="10" fill="#ffffff">Q・K tile load</text>

        <rect x="164" y="0" width="150" height="32" rx="5" fill="#3a6ea5"/>
        <text x="239" y="20" text-anchor="middle" font-size="10" fill="#ffffff">RoPE (in-place)</text>

        <rect x="0" y="40" width="150" height="32" rx="5" fill="#c44e52"/>
        <text x="75" y="60" text-anchor="middle" font-size="10" fill="#ffffff">QK<tspan font-size="8" dy="-3">⊤</tspan> @ HMX</text>

        <rect x="164" y="40" width="150" height="32" rx="5" fill="#3a9e8f"/>
        <text x="239" y="60" text-anchor="middle" font-size="10" fill="#ffffff">online softmax (HVX)</text>

        <rect x="0" y="80" width="150" height="32" rx="5" fill="#c44e52"/>
        <text x="75" y="100" text-anchor="middle" font-size="10" fill="#ffffff">× V @ HMX</text>

        <rect x="164" y="80" width="150" height="32" rx="5" fill="#c9a227"/>
        <text x="239" y="100" text-anchor="middle" font-size="10" fill="#ffffff">accumulate</text>
      </g>
      <text x="180" y="170" text-anchor="middle" font-size="10" font-style="italic" fill="#1e5f55">모든 중간 텐서는 VTCM 안에 머무름</text>
    </g>

    <g transform="translate(30,260)">
      <rect x="0" y="0" width="360" height="14" rx="3" fill="#b9d8d3"/>
      <text x="180" y="11" text-anchor="middle" font-size="9" fill="#1e5f55">store final output → DDR (한 번만)</text>
    </g>

    <text x="210" y="298" text-anchor="middle" font-size="11" fill="#1e5f55" font-weight="600">총 DDR traffic: 1× · latency ↓ · power ↓</text>
  </g>
</svg>
