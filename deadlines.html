<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadline | Juneyoung Park</title>
  <meta name="description" content="Conference deadline tracker for AI, NLP, ML, CV, IR, Robotics, Speech, and Data Mining venues.">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fafaf8;
      --bg-secondary: #f2f1ed;
      --bg-card: #ffffff;
      --bg-accent: #f0eee8;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a5a;
      --text-tertiary: #8a8a9a;
      --accent: #1e3a5f;
      --accent-light: #e8eef5;
      --accent-hover: #142d4a;
      --accent-warm: #8b4513;
      --border: #e0ddd6;
      --border-light: #eae8e2;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
      --shadow-lg: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
      --radius: 8px;
      --nav-bg: rgba(250,250,248,0.92);
      --tag-bg: #eae8e2;
      --tag-text: #4a4a5a;
      --highlight-bg: #e8eef5;
      --serif: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      --sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0f0f14;
      --bg-secondary: #1a1a22;
      --bg-card: #1e1e28;
      --bg-accent: #22222e;
      --text-primary: #e8e6e0;
      --text-secondary: #a0a0ae;
      --text-tertiary: #6a6a7a;
      --accent: #7ca8d4;
      --accent-light: #1a2a3e;
      --accent-hover: #a0c4e8;
      --accent-warm: #c4855c;
      --border: #2a2a34;
      --border-light: #22222c;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
      --nav-bg: rgba(15,15,20,0.92);
      --tag-bg: #2a2a34;
      --tag-text: #a0a0ae;
      --highlight-bg: #1a2a3e;
    }

    html { scroll-behavior: smooth; scroll-padding-top: 80px; }

    body {
      position: relative;
      font-family: var(--sans);
      background: #ffffff;
      color: var(--text-primary);
      line-height: 1.7;
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      filter: blur(34px) saturate(145%);
      pointer-events: none;
      opacity: 0.85;
    }

    body::before {
      width: 340px;
      height: 340px;
      left: -90px;
      top: -60px;
      background: radial-gradient(circle at 30% 30%, rgba(65, 174, 255, 0.42), rgba(110, 93, 255, 0.22) 58%, rgba(255, 255, 255, 0) 75%);
    }

    body::after {
      width: 420px;
      height: 420px;
      right: -110px;
      bottom: 8%;
      background: radial-gradient(circle at 70% 70%, rgba(255, 113, 184, 0.34), rgba(255, 172, 113, 0.25) 58%, rgba(255, 255, 255, 0) 78%);
    }

    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent-hover); }

    ::selection { background: var(--accent-light); color: var(--accent); }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 10px 26px rgba(28, 45, 79, 0.09);
      transition: background 0.3s;
    }

    .nav-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 17px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .nav-links a {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text-primary);
      background: var(--bg-secondary);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all 0.2s;
      margin-left: 8px;
    }

    .theme-toggle:hover {
      color: var(--text-primary);
      border-color: var(--text-tertiary);
      background: var(--bg-secondary);
    }

    .theme-toggle svg { width: 16px; height: 16px; }

    [data-theme="dark"] body {
      background: #0f1016;
    }

    [data-theme="dark"] nav {
      background: rgba(23, 28, 41, 0.66);
      border-bottom-color: rgba(143, 170, 218, 0.26);
      box-shadow: 0 10px 26px rgba(3, 6, 16, 0.45);
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 112px 24px 72px;
    }

    .deadline-hero {
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 8px;
    }

    h1 {
      font-family: var(--serif);
      font-size: 42px;
      line-height: 1.08;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .hero-copy {
      max-width: 640px;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .search-box {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font: inherit;
      padding: 0 14px;
      outline: none;
    }

    [data-theme="dark"] .search-box {
      background: var(--bg-card);
    }

    .search-box:focus {
      border-color: rgba(116, 154, 214, 0.72);
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filter-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-card);
      color: var(--text-secondary);
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, color 0.2s;
    }

    .filter-btn:hover { transform: translateY(-1px); }

    .filter-btn.active {
      color: var(--accent);
      background: var(--accent-light);
      border-color: rgba(116, 154, 214, 0.45);
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px;
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
    }

    .dot.predicted { background: #8b5cf6; }
    .dot.past { background: #9ca3af; }

    .deadline-list {
      display: grid;
      gap: 12px;
    }

    .deadline-card {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) minmax(260px, 1.25fr) minmax(210px, 0.95fr);
      gap: 18px;
      align-items: stretch;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-card);
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .deadline-card:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }

    [data-theme="dark"] .deadline-card {
      background: var(--bg-card);
      border-color: var(--border);
      box-shadow: var(--shadow);
    }

    .conf-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .conf-acronym {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text-primary);
    }

    .area-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .area-tag {
      display: inline-flex;
      align-items: center;
      height: 20px;
      border-radius: 5px;
      padding: 0 7px;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .conf-name {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.45;
    }

    .event-line {
      margin-top: 7px;
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .deadline-main {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .venue-line {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .venue-title {
      color: var(--text-primary);
      font-weight: 700;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .date-pill,
    .status-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.01em;
      border: 1px solid rgba(211, 220, 233, 0.9);
      background: rgba(245, 248, 252, 0.88);
      color: #526071;
      line-height: 1;
    }

    .status-pill.upcoming {
      color: #075985;
      background: #e0f2fe;
      border-color: #bae6fd;
    }

    .status-pill.soon {
      color: #7c2d12;
      background: #ffedd5;
      border-color: #fed7aa;
    }

    .status-pill.past {
      color: #4b5563;
      background: #f3f4f6;
      border-color: #e5e7eb;
    }

    .status-pill.predicted {
      color: #5b21b6;
      background: #ede9fe;
      border-color: #ddd6fe;
    }

    .sub-deadlines {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sub-deadline {
      border-radius: 7px;
      padding: 5px 8px;
      background: rgba(232, 238, 245, 0.64);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .history {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .history-title {
      color: var(--text-tertiary);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border-light);
    }

    .history-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .empty-state {
      display: none;
      padding: 40px 16px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--text-tertiary);
      text-align: center;
    }

    @media (max-width: 860px) {
      .nav-inner { padding: 0 16px; }
      .nav-links a { padding: 6px 8px; font-size: 12px; }
      main { padding: 92px 16px 52px; }
      .deadline-hero,
      .toolbar,
      .deadline-card {
        grid-template-columns: 1fr;
      }
      .filters { justify-content: flex-start; }
    }

    @media (max-width: 620px) {
      .nav-links a:nth-child(n+4):not(.active) { display: none; }
      h1 { font-size: 34px; }
      .deadline-card { padding: 16px; }
    }
  </style>
</head>

      { acronym: 'COLM', areas: ['NLP'], name: 'Conference on Language Modeling', year: '2027', venue: 'venue TBD', event: 'Conference dates TBD', official: false, predicted: true, deadlines: [{ label: 'Main', date: '2027-04-01' }], history: ["'26 San Francisco, USA · Apr 1", "'25 Montreal, Canada · Mar 29"] },
      { acronym: 'NeurIPS', areas: ['ML'], name: 'Conference on Neural Information Processing Systems', year: '2027', venue: 'venue TBD', event: 'Conference dates TBD', official: false, predicted: true, deadlines: [{ label: 'Main', date: '2027-05-06' }], history: ["'26 Sydney, Australia · May 7", "'25 San Diego, USA · May 16"] },
      { acronym: 'LREC', areas: ['NLP'], name: 'International Conference on Language Resources and Evaluation', year: '2028', venue: 'venue TBD', event: 'Conference dates TBD', official: false, predicted: true, deadlines: [{ label: 'Main', date: '2027-10-25' }], history: ["'26 Palma de Mallorca, Spain · Oct 25", "'24 LREC-COLING Turin, Italy · Oct 21"] }
    ];

    const listEl = document.getElementById('deadlineList');
    const emptyEl = document.getElementById('emptyState');
    const filtersEl = document.getElementById('deadlineFilters');
    const searchEl = document.getElementById('deadlineSearch');
    const allAreas = ['All'].concat(Array.from(new Set(DEADLINES.flatMap(item => item.areas))).sort());
    let activeArea = 'All';

    function dateSerial(date) {
      const parts = date.split('-').map(Number);
      return Date.UTC(parts[0], parts[1] - 1, parts[2]) / 86400000;
    }

    function todayKstSerial() {
      const today = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(new Date());
      return dateSerial(today);
    }

    function parseDeadline(date) {
      const parts = date.split('-').map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2], 23, 59, 59);
    }

    function daysUntil(date) {
      return dateSerial(date) - todayKstSerial();
    }

    function formatDate(date) {
      return parseDeadline(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function nextDeadline(item) {
      const sorted = item.deadlines.slice().sort((a, b) => parseDeadline(a.date) - parseDeadline(b.date));
      return sorted.find(d => daysUntil(d.date) >= 0) || sorted[sorted.length - 1];
    }

    function sortValue(item) {
      const next = nextDeadline(item);
      const days = daysUntil(next.date);
      return days < 0 ? Number.MAX_SAFE_INTEGER + Math.abs(days) : dateSerial(next.date);
    }

    function statusFor(item, deadline) {
      const days = daysUntil(deadline.date);
      if (days < 0) return { label: 'Past', cls: 'past' };
      if (days <= 14) return { label: days === 0 ? 'Today' : days + ' days left', cls: 'soon' };
      return { label: days + ' days left', cls: item.predicted ? 'predicted' : 'upcoming' };
    }

    function renderFilters() {
      filtersEl.innerHTML = allAreas.map(area =>
        '<button class="filter-btn' + (area === activeArea ? ' active' : '') + '" type="button" data-area="' + area + '">' + area + '</button>'
      ).join('');
      filtersEl.querySelectorAll('.filter-btn').forEach(button => {
        button.addEventListener('click', () => {
          activeArea = button.dataset.area;
          renderFilters();
          renderDeadlines();
        });
      });
    }

    function renderDeadlines() {
      const query = searchEl.value.trim().toLowerCase();
      const rows = DEADLINES
        .filter(item => activeArea === 'All' || item.areas.includes(activeArea))
        .filter(item => {
          if (!query) return true;
          return [item.acronym, item.name, item.venue, item.year].concat(item.areas).join(' ').toLowerCase().includes(query);
        })
        .sort((a, b) => sortValue(a) - sortValue(b));

      listEl.innerHTML = rows.map(item => {
        const next = nextDeadline(item);
        const status = statusFor(item, next);
        const secondary = item.deadlines
          .filter(d => d !== next)
          .map(d => '<span class="sub-deadline">' + d.label + ' · ' + formatDate(d.date) + '</span>')
          .join('');
        return '<article class="deadline-card">' +
          '<div>' +
            '<div class="conf-head">' +
              '<h2 class="conf-acronym">' + item.acronym + '</h2>' +
              '<div class="area-tags">' + item.areas.map(area => '<span class="area-tag">' + area + '</span>').join('') + '</div>' +
            '</div>' +
            '<p class="conf-name">' + item.name + '</p>' +
            '<p class="event-line">Conference · ' + item.event + '</p>' +
          '</div>' +
          '<div class="deadline-main">' +
            '<div class="venue-line"><span class="venue-title">' + item.acronym + ' ' + item.year + (item.predicted ? ' predicted' : '') + '</span><span>' + item.venue + '</span></div>' +
            '<div class="status-row"><span class="date-pill">' + next.label + ' · ' + formatDate(next.date) + '</span><span class="status-pill ' + status.cls + '">' + status.label + '</span>' + (item.official ? '<span class="status-pill upcoming">Official</span>' : '<span class="status-pill predicted">Predicted</span>') + '</div>' +
            (secondary ? '<div class="sub-deadlines">' + secondary + '</div>' : '') +
          '</div>' +
          '<div class="history">' +
            '<p class="history-title">Recent history</p>' +
            item.history.map(history => '<div class="history-item"><span>' + history + '</span></div>').join('') +
          '</div>' +
        '</article>';
      }).join('');
      emptyEl.style.display = rows.length ? 'none' : 'block';
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);
    }

    function updateThemeIcon(theme) {
      document.getElementById('sunIcon').style.display = theme === 'dark' ? 'block' : 'none';
      document.getElementById('moonIcon').style.display = theme === 'dark' ? 'none' : 'block';
    }

    document.getElementById('themeToggle').addEventListener('click', function() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeIcon(next);
    });

    searchEl.addEventListener('input', renderDeadlines);
    initTheme();
    renderFilters();
    renderDeadlines();
  </script>
</body>
</html>
